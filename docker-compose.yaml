services:

  jobmanager:
      build: 
        context: .
        dockerfile: Dockerfile
      hostname: jobmanager
      container_name: jobmanager
      depends_on:
          iceberg-rest:
            condition: service_healthy
      networks:
          sky_net:
      ports:
        - "8082:8081"
      command: jobmanager
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
        start_period: 30s
        interval: 5s
        timeout: 3s
        retries: 5
      environment:
        FLINK_PROPERTIES: |
          jobmanager.rpc.address: jobmanager
          taskmanager.numberOfTaskSlots: 4
          parallelism.default: 2
        AWS_REGION: us-east-1
        AWS_ACCESS_KEY_ID: admin
        AWS_SECRET_ACCESS_KEY: password
        S3_ENDPOINT: http://minio:9000


  taskmanager:
    build: 
      context: .
      dockerfile: Dockerfile
    hostname: taskmanager
    command: taskmanager
    container_name: taskmanager

    depends_on:
      jobmanager:
        condition: service_healthy

    networks:
       sky_net:

    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      S3_ENDPOINT: http://minio:9000


  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka

    networks:
      sky_net:

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data 


  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: akhq
    hostname: akhq

    depends_on:
      - kafka

    networks:
      sky_net:

    ports:
      - "8087:8080"

    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka:9092" 
              schema-registry:
                  url: "http://schema-registry:8081"


  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    hostname: schema-registry

    depends_on:
      - kafka

    networks:
      sky_net:

    ports:
      - "8081:8081"

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092

      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT


  iceberg-rest:
      image: apache/iceberg-rest-fixture
      hostname: iceberg-rest
      depends_on:
        create-bucket:
          condition: service_completed_successfully
      container_name: iceberg-rest
      networks:
        sky_net:
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
        interval: 5s
        timeout: 3s
        retries: 5
      environment:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: password
          CATALOG_WAREHOUSE: s3://warehouse/
          CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
          CATALOG_S3_ENDPOINT: http://minio:9000
          CATALOG_S3_PATH_STYLE_ACCESS: "true"
          CATALOG_S3_ACCESS__KEY__ID: admin
          CATALOG_S3_SECRET__ACCESS__KEY: password
          AWS_ENDPOINT_URL_S3: http://minio:9000
          AWS_S3_FORCE_PATH_STYLE: "true"


  minio:
    image: minio/minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      sky_net:
        aliases:
          - warehouse.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - minio-data:/data


  create-bucket:
    image: minio/mc

    depends_on:
      minio:
        condition: service_healthy

    networks:
      sky_net:

    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password)
      do
        echo 'waiting for minio...' && sleep 1;
      done;

      /usr/bin/mc mb minio/warehouse --ignore-existing;
      /usr/bin/mc policy set public minio/warehouse;
      exit 0;
      "


  trino-coordinator:
    image: trinodb/trino:476
    container_name: trino-coordinator
    ports:
      - "8085:8080"
    volumes:
      - ./trino/etc:/etc/trino
    networks:
      sky_net:
    depends_on:
      - minio
      - iceberg-rest


  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile

    container_name: superset
    networks:
       sky_net:
    ports:
      - "8088:8088"

    environment:
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@superset.com
      ADMIN_PASSWORD: admin

      SUPERSET_SECRET_KEY: "pmFmur1eluMiQDoZA+cGHhY/cA8+0+Ko7EZi5afhXWlH1oH/rQkVHNVOY1hRXAUi"

      TALISMAN_ENABLED: "False"

    volumes:
      - superset-data:/app/superset_home


  data-generator:
      build:
        context: ./data
        dockerfile: Dockerfile
      container_name: data-generator
      volumes:
      - ./config:/app/config
      networks:
        sky_net:
      depends_on:
        - kafka


networks:
  sky_net:


volumes:
  kafka-data:
  minio-data:
  superset-data:

